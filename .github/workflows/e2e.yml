name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: thamy_shoes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d thamy_shoes_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL_TEST }}
      DIRECT_URL: ${{ secrets.DATABASE_URL_TEST }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # Desliga o rate limiter de login (5 req/15min por IP), que de outra
      # forma devolve 429 a partir do 6o login e derruba os demais testes.
      # Opt-in exclusivo deste workflow: NUNCA definir em env de deploy.
      E2E_DISABLE_RATE_LIMIT: '1'
      CRON_SECRET: test-cron-secret
      RESEND_API_KEY: re_test_key
      ADMIN_EMAIL: admin@thamyshoes.com.br
      NOTIFICATION_EMAIL_TO: admin@thamyshoes.com.br
      BLING_CLIENT_ID: test-client-id
      BLING_CLIENT_SECRET: test-client-secret
      BLING_REDIRECT_URI: http://localhost:3000/api/bling/callback
      ENCRYPTION_KEY: a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2
      # Placeholders: nao existe bucket real no runner. A geracao de ficha/PDF faz
      # upload para o Supabase Storage e falha com "fetch failed" contra estes
      # valores, entao os cenarios que geram PDF ficam skipped via E2E_NO_STORAGE.
      # Para habilita-los: provisione um projeto Supabase exclusivo de teste,
      # cadastre SUPABASE_URL/SUPABASE_SERVICE_KEY como secrets do repositorio e
      # remova E2E_NO_STORAGE. NUNCA usar as credenciais de producao aqui.
      SUPABASE_URL: https://test-project.supabase.co
      SUPABASE_SERVICE_KEY: test-supabase-service-key
      E2E_NO_STORAGE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Checar drift entre prisma/migrations e schema.prisma
        # Guard de regressao. O historico de migrations ja divergiu do
        # schema.prisma uma vez (drift aplicado fora do historico direto em
        # producao), e o sintoma so apareceu meses depois como `migrate deploy`
        # impossivel de rodar. Este step falha o CI no mesmo commit que
        # introduzir a divergencia: `--exit-code` devolve 2 quando o diff nao e
        # vazio. Conserto do desenvolvedor: `npx prisma migrate dev --name ...`
        # em vez de `db push` contra um banco compartilhado.
        run: |
          # DROP/CREATE DATABASE nao roda dentro de transacao, entao duas chamadas
          # separadas em vez de dois -c no mesmo psql.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'DROP DATABASE IF EXISTS shadow'
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE shadow'
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "${DATABASE_URL%/*}/shadow" \
            --exit-code

      - name: Provision test database schema
        # `migrate deploy` e nao `db push`: e o mesmo caminho que uma mudanca de
        # schema percorre em producao, entao o CI valida o historico de verdade.
        run: npx prisma migrate deploy

      - name: Seed test data
        run: npm run seed:test

      - name: Build Next.js
        run: npm run build

      - name: Run E2E tests
        run: npx playwright test
        env:
          CI: true
          BASE_URL: http://localhost:3000

      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
