name: Deploy Produção (manual)

# ATENÇÃO: este workflow NÃO é o caminho normal de deploy.
#
# A integração Git da Vercel já publica produção em todo push na main
# (projeto thamy-shoes-app, productionBranch: main). Este workflow existe
# apenas para o caso manual de republicar a main atual sem precisar de um
# commit vazio: redeploy após mudar env var no painel, ou reconstrução
# assistida depois de um incidente.
#
# Duas coisas que a versão anterior deste arquivo tentava fazer e que foram
# removidas de propósito:
#
# 1. Passar env de runtime para o step de deploy. Não tem efeito nenhum:
#    `vercel deploy` não injeta o env do runner no runtime da função. As 17
#    variáveis de runtime moram no projeto Vercel (targets development /
#    preview / production) e é o `vercel pull` que as traz para o build.
#    Nada de credencial de runtime precisa existir nos secrets do GitHub.
#
# 2. Rodar `prisma migrate deploy` contra produção. O histórico de migrations foi
#    saneado em 02/09/2026 (baseline `0_init` + `migrate resolve --applied`), então
#    hoje `migrate deploy` contra produção é um no-op seguro e não mais a armadilha
#    que era. Ele continua fora daqui por outro motivo: este workflow é redeploy
#    manual, não o caminho normal de deploy — quem publica produção é a integração
#    Git da Vercel, que não roda migration. Aplicar migration por um caminho que
#    quase nunca é percorrido daria a falsa impressão de que mudança de schema
#    chega em produção sozinha. Mudança de schema é operação manual e deliberada,
#    feita ANTES do deploy do código que depende dela (ver CONTRIBUTING.md,
#    secao "Banco de dados"). O guard contra reincidência do drift vive no
#    e2e.yml, que roda em todo push.

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Digite PRODUCAO para confirmar o deploy'
        required: true
        type: string

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy-prod:
    name: Deploy para Produção
    runs-on: ubuntu-latest
    environment: Production

    env:
      # Identificadores do projeto, não segredos — quem dá acesso é o token.
      # Ficam como secrets só para o workflow sobreviver a rename/transfer
      # do projeto sem edição de código.
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      # O input entra por variável de ambiente, não interpolado no script:
      # `${{ }}` direto dentro de `run` é vetor de script injection.
      - name: Confirmar intenção
        env:
          CONFIRMAR: ${{ inputs.confirmar }}
        run: |
          if [ "$CONFIRMAR" != "PRODUCAO" ]; then
            echo "::error::Deploy abortado. Digite exatamente PRODUCAO para confirmar."
            exit 1
          fi
          echo "Confirmado. Publicando ${GITHUB_SHA:0:7} em produção."

      - name: Checar secrets obrigatórios
        run: |
          faltando=""
          [ -n "$VERCEL_TOKEN" ]      || faltando="$faltando VERCEL_TOKEN"
          [ -n "$VERCEL_ORG_ID" ]     || faltando="$faltando VERCEL_ORG_ID"
          [ -n "$VERCEL_PROJECT_ID" ] || faltando="$faltando VERCEL_PROJECT_ID"
          if [ -n "$faltando" ]; then
            echo "::error::Secrets ausentes no repositório:$faltando"
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Espelha o nodeVersion do projeto Vercel (24.x).
          node-version: '24'

      # Sem `npm ci`: o próprio `vercel build` roda o install, replicando o
      # build da plataforma em vez de aproximá-lo.
      - name: Instalar Vercel CLI
        run: npm i -g vercel@latest

      - name: Puxar configuração de produção
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build de produção
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Publicar em produção
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "Deploy de produção: $url"
          {
            echo "### Deploy de produção"
            echo ""
            echo "- commit: \`${GITHUB_SHA:0:7}\`"
            echo "- url: $url"
          } >> "$GITHUB_STEP_SUMMARY"
